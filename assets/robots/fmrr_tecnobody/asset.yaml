schema_version: 1
name: fmrr_tecnobody
manufacturer: Tecnobody
urdf: description/fmrr_tecnobody.urdf
# Kinematic-chain order: the y carriage carries the x beam, which carries the
# z column (base_link -> joint_y -> link1 -> joint_x -> link2 -> joint_z).
# The identification stack requires the declared order to equal the URDF's
# chain order, because that is the order Pinocchio builds and it cannot be
# permuted (elastic_sim.identification.build_model).  Every consumer derives
# its column order from this list, so sim and real recordings stay aligned;
# `ros.sensor.flange_to_link_side_axes` is a sensor-axis permutation, not a
# joint one, and is unaffected (R5_02 Sec 5).
active_joints: [joint_y, joint_x, joint_z]
base:
  position: [0.0, 0.0, 0.0]
  quaternion: [0.0, 0.0, 0.0, 1.0]
gravity: [0.0, 0.0, -9.81]
self_collisions: true
kinematic_groups:
  cartesian:
    joints: [joint_x, joint_y, joint_z]
    tip_link: ee_link
    translation_only: true
# ATI Axia90, at `ft_link` after the flange and the (locked) yaw joint -- i.e.
# at the end effector, not at the transmission output.  In free motion it
# measures only what is mounted past it, which on this platform is the handle:
# 5 kg, about 49 N of static weight (R5_04 Sec 3, R5_Q Q-8).  The legacy
# simulator mapped the *spring* force to this channel, which is not what the
# cell reads (R5_01 Amendment 1 consequence 3).
force_torque_sensor:
  frame: ft_link

collision:
  margin: 0.0
  max_joint_step: 0.05
dataset:
  state_units: m
  torque_units: N
  source: synthetic_or_ros_recording
