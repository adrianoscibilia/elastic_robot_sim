# Sim-to-real calibration configuration
# ----------------------------------------
# Loaded by SimCalibrationProblem and the optimizer runner scripts.

# Which parameters to tune (others are fixed at their settings.yaml values).
# Stiffness is sampled in log-space; damping_ratio in linear space.
tunable_params:
  - drive_x.stiffness
  - drive_x.damping_ratio
  - drive_y.stiffness
  - drive_y.damping_ratio
  - drive_z.stiffness
  - drive_z.damping_ratio
  # Uncomment to include payload in the optimisation (only if payload is unknown):
  # - payload

# Fidelity metric weights passed to compare().
# Increase "force" weight if torque/force matching is more important than position.
metric_weights:
  position: 1.0
  velocity: 0.3
  force:    0.5

# Simulation settings for calibration rollouts
simulation:
  noise: false          # disable sensor noise for cleaner loss landscape
  cut_off_time: 2.0     # skip initial transient (seconds)
  time_step: 0.01       # integration step (s); must match real-robot recording

# Data settings
data:
  rollouts_dir: data/rollouts   # relative to repo root
  train_fraction: 0.8           # fraction of rollouts used for optimisation

# Optimizer selection and per-backend hyperparameters.
# Switch backend by changing "backend" below.
optimizer:
  backend: cma   # options: cma | bo | skrl

  cma:
    sigma0: 0.3         # initial step-size in normalised [-1, 1] space
    max_evals: 300      # total function evaluations budget
    tolfun: 1.0e-7
    tolx:   1.0e-7

  bo:
    max_evals: 80
    n_initial_points: 15
    acq_func: EI        # EI | LCB | PI
    noise: gaussian

  skrl:
    algorithm: ppo      # ppo | sac
    max_evals: 10000
    context_dim: 4      # trajectory-type one-hot (modes 0-3)
    device: cpu
