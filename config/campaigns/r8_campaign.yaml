# identified_filter/01 (weekend campaign): settings of scripts/r8_campaign.py.  CLI flags override.
run_id: r8-campaign
unit: r8-campaign                 # systemd --user unit of `launch`
data_root: data/identification/r8
deadline: "2026-11-02T06:00"      # Sec 4: past it, drop jobs from the tail (P3 first, then P2), never P1
parallel_seeds: 3                 # r7's; 2 if the plan shows the GPU does not fit three
seeds: [0, 1, 2]
epochs: 150                       # 02 R2: r8 has ~6.7x r7's train windows per epoch (r7: 300 / 30)
patience: 20
student_epochs: 40                # 02 R2 (01 Sec 2.7 had 60 / 10)
student_patience: 8
coupling: full                    # the r7 preflight's choice on both arms (runs/r7-taufree-*/coupling.env)
min_free_gb: 50
# Which per-bag (K, D) the teacher and the parameter loss read: `effective` (the bag's LS linear pair of the
# clean transmission torque on the true deflection, round8.effective_transmission) or `sampled` (the robot's
# middle spring segment).  The r6/r7 plant's spring is nonlinear and carries the transmission error, so the
# sampled K is not what a linear filter can identify (results/datasets.md, the oracle fit).  Confirmed (02 Sec 0).
privileged_source: effective

platforms:
  iiwa_drive:
    config: config/identification/kuka_lbr_iiwa_14_r820_table_drive_round8.yaml
    stem: kuka_lbr_iiwa_14_r820_table_drive_round8
    r7_chain: runs/r7-taufree-20261015-1231/chain-iiwa_drive-taufree.yaml
    r7_epochs: {kalnn_twomass_id: 299, lnn_twomass_id: 109, kalnn_twomass: 299, kalnn_tau_res: 68, default: 200}
    decimation: 1
  ur10:
    config: config/identification/ur10_table_round8.yaml
    stem: ur10_table_round8
    r7_chain: runs/r7-taufree-20261015-1231/chain-ur10-taufree.yaml
    r7_epochs: {kalnn_twomass_id: 208, lnn_twomass_id: 135, kalnn_twomass: 208, kalnn_tau_res: 52, default: 150}
    decimation: 4                 # Sec 2.4: one checkpoint for the 500 Hz simulation and the 125 Hz real files
    decimation_p: 0.5

# Sec 5.  kind: teacher | phys | student | r7_residual | r7_twomass.  A student loads J1's seed of the same index
# (Sec 2.7) unless own_teacher (J9's MLP backbone and J10's q_dq residual need their own teacher).
jobs:
  J1:  {priority: 1, kind: teacher}                                   # 2M-KALNN-T: ceiling; J3's initialisation
  J2:  {priority: 1, kind: phys}                                      # 2M-KALNN-PHYS: anchored, no identification
  J3:  {priority: 1, kind: student}                                   # 2M-KALNN-ID: the proposed model
  J4:  {priority: 1, kind: r7_residual}                               # KALNN residual, r7 config (q_dq)
  J5:  {priority: 2, kind: r7_twomass}                                # 2M-KALNN, r7 config, retrained on r8
  J6:  {priority: 2, kind: student, model_kwargs: {lambda_param: 0.0}}   # value of parameter supervision
  J7:  {priority: 2, kind: student, model_kwargs: {lambda_delta: 0.0}}   # value of deflection supervision
  J8:  {priority: 3, kind: student, seeds: [0, 1], model_kwargs: {encoder_causal: true}}   # online variant
  J9:  {priority: 3, kind: student, seeds: [0, 1], own_teacher: true, model_kwargs: {backbone: lnn}}
  J10: {priority: 3, kind: student, seeds: [0, 1], own_teacher: true, model_kwargs: {residual_inputs: q_dq}}
  J11: {priority: 3, kind: r7_residual, seeds: [0, 1], model_kwargs: {residual_inputs: dq_joint, drop_base_angle: true}}
