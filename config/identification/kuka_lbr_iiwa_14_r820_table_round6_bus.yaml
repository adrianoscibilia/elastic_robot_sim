# Round-6 production config for the KUKA LBR iiwa 14 R820 (R6_00), `bus`
# variant: the PD on the host at the 1 kHz FRI rate, torque mode.  The iiwa's
# interface is undecided, so `bus` and `drive` are both first-class variants
# built from the same robots and seeds (R6_04 A-1); the two files differ only
# in simulation.controller, the output name and the gates.
#
# The stiff member of the round-6 family (iiwa, UR10, FMRR).  All three share
# one signal design, one controller and one target (R6_00 Sec 0):
#
#   target       the ground-truth torque the transmission applies to the link,
#                tau_s = K(theta - q) + D(thetadot - qdot) with the spring's
#                nonlinearity and the transmission error, through the
#                platform's torque-measurement model (ft) and clean (ft_clean)
#   inputs       motor-side q, dq as the interface reports them, and the
#                noise-free commanded torque tau
#   controller   collocated, model-free motor-side PD at the sample rate on the
#                measured, delayed state; gains sized on the nominal rotor
#                inertia; no feedforward, no gravity compensation
#
# Priors not listed as changed below are the round-5 ones
# (kuka_lbr_iiwa_14_r820_table_round5.yaml), which stays untouched.  Every new
# number carries a row in docs/PARAMETER_PROVENANCE.md with its source ID
# (REFACTOR_SPECS/SOURCES.md).
#
# schema_version 3 makes each of these a load-time error: an unresolvable
# probe, any controller but the model-free PD, a violated gain bound
# (2 zeta omega T_c (1 + d) <= 0.5) and a violated explicit-term bound
# ((b + c/eps + d) h / M_eff <= 1).
schema_version: 3

asset: kuka_lbr_iiwa_14_r820_table

# Production is MuJoCo only; Newton is scripts/audit_backends.py (R5_10 T-3.2).
backends: [mujoco]
rigid_reference: true

transmission:
  robots: 20
  sampling: stratified
  stiffness_nominal: [2.4e4, 2.4e4, 1.6e4, 1.6e4, 9.0e3, 5.5e3, 5.5e3]  # Nm/rad, A1..A7
  stiffness_factor: [0.5, 2.0]
  stiffness_common_fraction: 0.0
  stiffness_provenance: [P, C, C, C, C, E, E]
  damping_ratio: [0.05, 0.2]
  rotor_inertia_nominal: [1.0, 1.0, 0.5, 0.5, 0.25, 0.15, 0.15]  # reflected [kg m^2]; the PD's J_nom
  rotor_inertia_factor: [0.5, 2.0]
  rotor_inertia_provenance: [C, C, C, C, C, E, E]
  inertia_samples: 512

# Unknown to everyone: the controller is commissioned without it.
payload:
  enabled: true
  mass: [0.0, 6.0]
  offset_x: [-0.08, 0.08]
  offset_y: [-0.08, 0.08]
  offset_z: [0.055, 0.235]      # 0.035 (iiwa_link_7 -> iiwa_link_ee) + [0.02, 0.20] past the flange
  size: [0.05, 0.25]
  per: robot

comparison:
  q_link_rms: 1.0e-4
  ft_relative_rms: 0.01
  deflection_relative_rms: 0.05

excitation:
  n_harmonics: 5
  base_frequency: 0.1
  n_periods: 1
  limit_margin: 0.12
  velocity_fraction: 0.75
  max_acceleration: 4.0
  centre_jitter: 1.0
  candidates: 48
  # R6_02 P2-1: the comb is aimed at the link-side modes, derived at load from
  # the f_link table (elastic_sim.link_modes): log-spaced lines from
  # min(lowest_hz, 0.5 f_link,low) to min(1.5 f_link,high, 0.09 x rate), the
  # consumer's derivative passband [S-12, S-14].  The resolved harmonics and
  # the table are in the manifest.
  probe_design:
    source: link_modes
    lowest_hz: 2.0
    lines: 32
    span: [0.5, 1.5]
  # R6_04 D-1: the probe is added on top of the main trajectory's full
  # acceleration budget (workspace coverage unchanged); its share is raised
  # until peak |tau|/effort reaches 0.8 or it equals the main budget
  # (scripts/round6_probe_fraction.py, reports/round6/fraction_*).
  probe_budget: additive
  probe_acceleration_fraction: 1.0   # sweep: reports/round6/fraction_<stem>.json
  regime:
    enabled: true
    max_acceleration: [1.0, 8.0]
    velocity_fraction: [0.3, 0.9]

dataset:
  trajectories: 3
  trajectories_per_robot: true
  # Motor friction is drawn per robot (simulation.motor_friction), so one
  # friction sample; friction_scale is that per-robot spread.
  friction_samples: 1
  friction_scale: [0.5, 2.0]
  seed: 20260928              # new in round 6: the RNG order changed (R6_00 Sec 1)
  output: data/identification/kuka_lbr_iiwa_14_r820_table_round6_bus.parquet
  metadata_columns: inline
  split:
    mode: holdout_robots
    test_robots: 4
    val_robots: 2
  signals:
    position_side: motor
    target: link_torque
    target_source: measured
    clean_columns: true

simulation:
  # R6_00 Sec 2: collocated motor-side PD, the least influential controller.
  #   kp_j = J_j,nom omega^2,  kd_j = 2 zeta J_j,nom omega
  # omega is drawn log-uniformly in [0.5, 0.9] x omega_max per bag, with
  #   omega_max = 0.5 / (2 zeta_max T_c (1 + d)) = 96.2 rad/s at 1 kHz, d = 1.
  controller:
    mode: pd
    randomize: true
    location: bus               # FRI torque mode (R6_02 Sec 7)
    gain_sizing: motor_inertia
    loop: sample_rate
    # R6_04 A-5: the allowed sag remedy, for the quasi-static gravity sag on
    # A2/A4 (R6_03 Sec 6): T_i = 30 / omega, anti-windup at the effort limit.
    integral:
      enabled: true
      time_factor: 30.0
      reason: "gravity sag on A2/A4, quasi-static per R6_03 Sec 6"
    nominal:
      knows_payload: false
  control_gains:
    enabled: true
    natural_frequency_fraction: [0.5, 0.9]
    damping_ratio: [0.7, 1.3]
  control_separation:
    min_ratio: 5.0
    action: warn            # recorded only: the model-free PD does no linearization
  # R6_00 Sec 5.4, class E: b_j = 0.05 effort_j / v_max_j, c_j = 0.02 effort_j,
  # replacing the asset's blanket b = 10, c = 0.1 (an asset artefact, R5_12 Sec 2).
  motor_friction:
    viscous_fraction: 0.05
    coulomb_fraction: 0.02
    epsilon: 1.0e-2
    per_robot: true
    provenance: E
  # R6_00 Sec 6: every recorded signal, as a percentage of the bag's signal
  # (modelling-error class, not a claim about the real sensor); quantization
  # exact where the interface's is known.
  noise:
    enabled: true
    delay_samples: 1             # one 1 ms FRI cycle
    q:
      # R6_02 Sec 3: an encoder is quantization plus one count of white noise,
      # not a percentage of RMS (0.01 % of RMS was ~800 iiwa counts).
      quantization: 5.989e-8     # rad per count, measured on the iiwa [S-1]
      sigma_quanta: 1.0
    dq:
      source: position_derivative   # FRI gives no velocity
    ft:
      p: 0.01                    # strain-gauge joint torque sensor
      gain: 0.01
      offset: 0.002              # x effort limit
    tag: modelling_error
    provenance: E
  plant_extras:
    link_friction:
      tier: fixed
      viscous: {nominal: [1.0, 1.0, 0.8, 0.8, 0.5, 0.3, 0.3], factor: [0.5, 2.0]}
      coulomb: {nominal: [4.5, 4.5, 3.0, 3.0, 1.7, 1.0, 1.0], factor: [0.5, 2.0]}
      provenance: E
      # Velocity-implicit, same law and magnitudes: explicitly, A7's 1 Nm of
      # Coulomb on a 3e-4 kg m^2 link is ~200x over the Sec 3 bound.
      integration: implicit
    # R6_00 Sec 5.2, class E [S-4, S-10]: the HD curve diluted by the linear
    # torque sensor in series; knees at 20 % / 75 % of each joint's effort limit.
    stiffness_nonlinearity:
      factors: [0.8, 1.0, 1.2]
      breakpoints_effort_fraction: [0.2, 0.75]
      provenance: E
    # R6_00 Sec 5.3, class P [S-1]: kinematic error inside the spring, twice
    # per wave-generator turn at ratio 160; phase drawn per bag.
    transmission_error:
      amplitude: 2.0e-4          # rad
      order: 320.0               # per rad of joint angle
      random_phase: true
      provenance: P
  # Derived at load from the Sec 3 bound table (R6_02 Sec 6: don't hand-set):
  # the largest step, at most 5e-4 s and dividing T_c, that keeps every DOF's
  # explicit terms <= 1 at the prior's worst corner.  With the per-axis effort
  # limits [S-13] this gives 2.5e-4 s elastic (A5 rotor, 0.89) and 5e-4 s
  # rigid (A5, 0.43); dataset_bounds.bound_limited_steps prints the table.
  rigid_time_step: auto
  max_time_step: auto
  sample_time_step: 0.001        # 1 kHz FRI; also the control period T_c

# R6_00 Sec 7: controller-influence gates.  Round 5 has no pd Q-C level on the
# iiwa (its pd build diverged, R5_11 Sec 3), so gate 3 has no reference here.
gates:
  sag_max_fraction: 0.05
  qc_v2_reference: {elastic: null, rigid: null, source: "none: no round-5 pd Q-C on the iiwa"}
  unstable_max_fraction: 0.02
  gainshift_fraction: [[0.3, 0.5], [0.9, 1.0]]
  gainshift_max_ratio: 1.3

visualization:
  enabled: false
  realtime_scale: 1.0
