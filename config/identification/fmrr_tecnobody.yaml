# Simulation-only identification workflow for the FMRR Tecnobody 3-axis
# Cartesian platform (R5_01 Sec 1, O-3).  Select it with
#   --config config/identification/fmrr_tecnobody.yaml
#
# This is the *elastic* member of the round-5 family (iiwa rigid, UR10
# intermediate, FMRR elastic).  Three differences from the arms' configs are
# structural, not tuning:
#
#  1. Units are metres and newtons: every axis is prismatic, so "stiffness" is
#     N/m, "rotor inertia" is a reflected mass in kg, and "torque" is force.
#  2. There is no table.  FMRR is its own gantry scene, so the asset is the
#     robot asset itself and no scene is composed (R5_01 Sec 1.3).
#  3. Joint order is the URDF's kinematic-chain order [joint_y, joint_x,
#     joint_z] -- the y carriage carries the x beam, which carries the z
#     column.  Pinocchio builds that order and cannot permute it, so the
#     asset declares it and every consumer inherits it.
#
# The mass matrix is constant and diagonal and gravity acts on the z axis only,
# which makes this the analytic test case of the family.  Since 2026-09-23 the
# URDF's inertials come from the CAD export
# (`assets/robots/fmrr_tecnobody/CAD_INERTIA.md`, R5_04 T-6): the machine moves
# 70.06 / 16.85 / 8.90 kg on joint_y / joint_x / joint_z, not the placeholders'
# 2.0 / 1.2 / 1.0, and every number below was re-derived from that.  Gravity
# loads joint_z with 87.3 N.
schema_version: 1

asset: fmrr_tecnobody

# MuJoCo only for now.  Newton's elastic path is the same MuJoCo engine under
# another API (R5_01 Sec 2), so on the elastic tier it is not an independent
# check; it is expected to work again on this soft, decoupled gantry and can be
# added back with `--backends mujoco newton` to measure that.
backends: [mujoco]
rigid_reference: true

transmission:
  robots: 12
  sampling: stratified
  # Joint order: y, x, z.  Nominal values are the *calibrated* legacy platform
  # stiffnesses (config/assets/fmrr_tecnobody_elastic.yaml, from the sim2real
  # calibration history): joint_y 7162, joint_x 5977, joint_z 3861 N/m.
  stiffness_nominal: [7162.0, 5977.0, 3861.0]     # N/m
  # r = 2, tighter than the UR10's r = 3: these came from fitting the real
  # platform, not from a datasheet reading of an inferred gearbox size.
  stiffness_factor: [0.5, 2.0]
  stiffness_common_fraction: 0.0
  stiffness_provenance: [C, C, C]
  # Legacy platform damping ratios were 0.49-1.2 (R5_00 Sec 3) -- an order of
  # magnitude above a harmonic drive's, as a belt/ballscrew axis is.
  damping_ratio: [0.4, 1.2]
  # Reflected motor mass [kg], applied as joint armature.  SETTLED in pass 3
  # (R5_Q Q-1; R5_07 Sec 2, T-17), and the uniform 12 kg it replaces was wrong
  # by an order of magnitude on the two distal axes.
  #
  # The owner named the drives: Delta ASDA-A2, ECMA-C10604 (400 W) on x and y,
  # ECMA-C10807 (750 W) on z.  The transmission ratio -- which dominates, since
  # m_ref = J / r^2 is quadratic in it -- did not have to be guessed after all:
  # the deployed EtherCAT configuration *is* the ratio.  From
  # CNR-STIIMA-IRAS/Fit4Med, tecnobody_workbench/config (R5_07 Sec 2.5):
  #
  #   delta400x/y  0x6064 position factor  2.380734375e-8 m per count
  #   delta750     0x6064 position factor  1.189742e-8    m per count
  #
  # At the ASDA-A2's 1,280,000 counts/rev that is 30.473 mm and 15.229 mm of
  # travel per motor revolution, i.e. r = 4.850e-3 and 2.4237e-3 m/rad.  The
  # same files' 0x606c velocity factors (5.079e-5 and 2.539e-5 m/s per 0.1 rpm,
  # Delta's own velocity unit) give 30.474 mm and 15.234 mm independently, so
  # two unrelated object-dictionary entries agree to 0.03 %.  The counts/rev
  # figure is the drive's, not the machine's, which is what makes this a
  # *measured* ratio rather than an inferred one; the stale "2 * pi / 2^17"
  # comments beside those lines are a leftover from a rotary template and do
  # not reproduce either factor.
  #
  #   m_ref = J / r^2 = 0.277e-4 / (4.850e-3)^2  =  1.18 kg   (x and y)
  #                   = 1.13e-4  / (2.4237e-3)^2 = 19.24 kg   (z)
  #
  # Three consequences, all re-derived below rather than asserted:
  #  * the distal axes' reflected mass is ~1.2 kg, not 12: it is now negligible
  #    beside the moved mass on y and x and the mode is set by the link alone;
  #  * z is the opposite -- 19.2 kg against 8.9 kg moved -- so its mode is set
  #    by the *motor*, and the 750 W frame is why;
  #  * the nominal modes move to 12.52 / 11.73 / 4.01 Hz and the sampled corners
  #    to 2.60-24.9 Hz, which is what the widened comb below is for.
  #
  # Still class E, and only for the rotor inertia: Delta's specification table
  # is behind a robots.txt block, so 0.277e-4 / 1.13e-4 kg m^2 are the standard
  # low-inertia figures for those frames rather than a read datasheet. The
  # factor [0.5, 2.0] is kept, not widened: with r measured it now covers only
  # the frame-inertia spread (a medium-inertia ECMA variant is ~2.5x the
  # low-inertia one), which is exactly what it should. One datasheet page moves
  # this to class D.
  rotor_inertia_nominal: [1.178, 1.178, 19.236]   # kg  (joint order y, x, z)
  rotor_inertia_factor: [0.5, 2.0]
  rotor_inertia_provenance: [E, E, E]
  inertia_samples: 64   # constant mass matrix: 64 samples is already exact

# What the *user* adds beyond the machine, not the handle: since the CAD rebuild
# the handle's own 5 kg is URDF hardware on `ee_link`, past the sensor (R5_04
# Sec 3), because it is permanently mounted and the URDF is the single source of
# inertial truth.  This block is therefore a smaller, genuinely variable load.
# Offsets place the box at the flange in link3's frame (flange_joint sits at
# z = -1.0 m, the F/T sensor 0.04 m and the end effector 0.11 m beyond it).  On a
# Cartesian gantry a payload's *offset* changes no joint dynamics at all -- a
# prismatic joint's gravity load is m * g . axis and its inertia is m -- so the
# offset only matters to the collision geometry and to the wrench's torque
# channels.
payload:
  enabled: true
  mass: [0.0, 2.0]
  offset_x: [-0.02, 0.02]
  offset_y: [-0.02, 0.02]
  offset_z: [-1.11, -1.04]
  size: [0.05, 0.15]
  per: robot

comparison:
  q_link_rms: 1.0e-4
  ft_relative_rms: 0.01
  deflection_relative_rms: 0.05

excitation:
  n_harmonics: 5
  base_frequency: 0.1
  n_periods: 1
  limit_margin: 0.12
  # URDF limits are already a sensible band (+-1.8 m on x/y, +-1.0 m on z), so
  # no position_window is needed; limit_margin applies to them directly.
  velocity_fraction: 0.6            # of the URDF's 1 m/s
  # SETTLED by the CAD masses (R5_Q Q-2, option (c); R5_04 Sec 1.4).  The
  # excitation now stays inside the URDF's own acceleration="0.5" limit: with
  # the real moved masses 0.5 m/s^2 already deflects the transmission by
  # 4.89 / 1.41 / 1.15 mm on joint_y / joint_x / joint_z, against micrometre-
  # scale encoder noise, so reaching the mode no longer needs an excitation
  # beyond what a rehabilitation device is rated for.  The modal energy goes
  # into the probe share instead (raised below), which is option (c).
  max_acceleration: 0.5             # m/s^2, the URDF's own limit
  centre_jitter: 1.0
  candidates: 48
  # Modal probe, 24 lines log-spaced 1.5-22 Hz =
  # elastic_sim.excitation.log_spaced_probe_harmonics(1.5, 22.0, 24, 0.1).
  # RE-DERIVED in pass 3 with the measured drive ratios (T-17): the mode is
  # 12.52 / 11.73 / 4.01 Hz nominal and 2.60-24.93 Hz across the sampled corners
  # of the priors above, against the 2.25-8.27 Hz the uniform 12 kg implied.  The
  # pass-2 comb's 20 Hz top was sized for the old band and covered barely half of
  # the new one.
  #
  # The top is 22 Hz and not 25, which would have bracketed the stiffest sampled
  # corner too, because 22.5 Hz is where this platform stops being able to
  # differentiate its own probe: a Savitzky-Golay derivative of order 3 has a
  # five-sample floor, so its widest passband is 0.45 * 250 / 5 = 22.5 Hz
  # (R5_08 Sec 2).  Between covering one extreme corner of a prior and keeping
  # FMRR the one config in the family whose probe survives the consumer's own
  # differentiation, the second is worth more.  The corner it gives up is the
  # k x 2, m_ref / 2 corner at 24.93 Hz on joint_y, which the 12 robots sample
  # only at their stiffest edge.
  probe_harmonics: [
    15, 17, 19, 21, 24, 27, 30, 34, 38, 43, 48, 54,
    61, 68, 77, 86, 97, 109, 123, 138, 155, 174, 196, 220,
  ]
  # Raised from 0.3: this is R5_Q Q-2's option (c) in one number.  Gross motion
  # stays inside the URDF's 0.5 m/s^2 while the probe, which is what actually
  # reaches the mode, gets a larger share of that budget.
  probe_acceleration_fraction: 0.4
  regime:
    enabled: true
    # Inside the URDF limit at the top end, so no sampled trajectory exceeds it.
    max_acceleration: [0.15, 0.5]   # m/s^2
    velocity_fraction: [0.3, 0.8]

dataset:
  trajectories: 3
  trajectories_per_robot: true
  # The FMRR URDF declares no <dynamics damping/friction>, so motor-side
  # friction sampling is a no-op on this asset, exactly as on the UR10.
  # Link-side friction is configured explicitly under simulation.plant_extras.
  friction_samples: 1
  friction_scale: [0.5, 2.0]
  seed: 20260922
  output: data/identification/fmrr_tecnobody.parquet
  metadata_columns: inline
  split:
    mode: holdout_robots
    test_robots: 3
    val_robots: 2
  # The owner's round-5 signal design (R5_01 Amendment 2): motor-side position
  # and velocity plus the motor effort as inputs, link-side force as the
  # target.  On FMRR the hardware fixes this -- the drives report a motor-side
  # encoder (0x6064) and a current-derived motor torque (0x6077), and there is
  # no link-side encoder at all.
  signals:
    position_side: motor
    # R5_06 Sec 2.1 (Q-10): the target is what the platform can *measure*, and
    # on FMRR that is the Axia90 at ft_link -- the handle interaction force a
    # rehabilitation controller acts on.  The tension Q-10 resolved is real and
    # structural and must stay visible to any consumer: the cell sees the 5 kg
    # handle while the transmission moves 70 kg, so this target carries 1-3x the
    # cell's noise in elastic content against the 27-28x the (unmeasurable)
    # spring force carries on the same bags (R5_05 Sec 6.4).  A target that
    # cannot be recorded is not a target.
    target: ee_wrench_joint
    # T-10: `tau_link_clean*` keeps the simulated spring force in the file as
    # debug columns beside the measurable target, so the sim-only elastic
    # science question can still be asked on FMRR -- clearly labelled as
    # simulation-only -- without regenerating anything.
    clean_columns: true

simulation:
  # The separation bound k >= (5 omega)^2 J_eff at the soft corner of the priors
  # (k/2, 2x reflected mass) gives omega <= 3.3 rad/s with the CAD masses and the
  # measured drive ratios (the soft corner's mode is 2.60 Hz = 16.3 rad/s; T-17),
  # against 2.8 rad/s from the uniform 12 kg and 8.8 from the placeholder masses.
  # The shipped gains are kept: they satisfy the re-derived bound with margin, and
  # moving them would change the data for no measured reason.  They bind only the
  # computed-torque and PD modes; the shipped `velocity_pi` is model-free, so the
  # guard records its ratio without enforcing it (R5_02 Sec 2.5).
  control_frequency: 2.2
  control_damping_ratio: 1.0
  control_gains:
    enabled: true
    natural_frequency: [1.8, 2.8]   # rad/s
    damping_ratio: [0.7, 1.3]
  control_separation:
    min_ratio: 5.0
    action: warn
  # The round-5 controller (R5_01 Amendment 2).  FMRR runs Cyclic Synchronous
  # Position today, with the position, velocity and current loops closed inside
  # the drive; its launch file also carries an inactive
  # forward_velocity_controller.  So the simulated controller is a model-free
  # outer position loop over the drive's own PI velocity loop, whose gains are
  # ours to guess and therefore drawn per bag.  Exact computed torque
  # (SeaMotorController) has no counterpart on this platform at all.
  controller:
    mode: velocity_pi
    randomize: true
    velocity_loop:
      # The drive's inner loop, [rad/s] -- here [1/s], the axes being prismatic.
      # R5_Q Q-6: the range must *straddle* the transmission mode rather than
      # stay below it, because a real drive does ring against it and the ringing
      # bags are where the damping ratio becomes observable (C5b/C5c).
      # RE-DERIVED in pass 3 with the measured drive ratios (T-17): the mode now
      # spans 16.3-156.6 rad/s across the sampled corners (2.60-24.93 Hz), so
      # pass 2's [8, 60] sat entirely *below* the upper half of the band and
      # stopped straddling it.  [10, 200] brackets the new band at both ends.
      velocity_bandwidth: [10.0, 200.0]
      # Still the cascade bound against the slowest inner loop the range allows
      # (position_gain <= velocity_bandwidth / 2 = 5.0).
      position_gain: [1.5, 5.0]      # 1/s, outer loop: ours
      integral_time: [0.05, 0.30]    # s
    nominal:
      # Irrelevant to a model-free mode and kept explicit so a switch to
      # nominal_ct on the command line is honest about the payload.
      knows_payload: false
  # The legacy platform's measurement model (R5_00 Sec 3), in metres/newtons.
  # This is the second way that platform was more realistic than the round-4
  # arms: nothing in a round-4 dataset is quantized or noisy.
  measurement:
    encoder_resolution: 1.2e-8       # m per count
    q_noise: 5.0e-6                  # m
    dq_noise: 1.0e-2                 # m/s
    tau_noise_rel: 0.03              # 3 % of the reading
    tau_noise_abs: 0.01              # N floor
    tau_gain_error: 0.03             # +-3 % per channel per bag
    delay_samples: 1                 # one 4 ms sample of bus + filter delay
    # The ATI Axia90 is a different instrument from the drives' current-derived
    # torque, so it gets its own noise figures.  The reason is structural, not a
    # tuning: a strain-gauge cell's noise is a resolution floor that does not
    # grow with the load, while a current-derived torque's really is proportional
    # to the reading.  Applying the drives' 3 % relative figure to a wrench
    # channel that carries the handle's 49 N of static weight manufactures a
    # 1.5 N noise term out of that bias alone.
    # It is *not* a fix for the marginal signature R5_05 Sec 6.4 measures: it
    # moves which axis suffers.  Measured elastic-force / noise per axis
    # (joint_y / joint_x / joint_z): 6.3 / 5.1 / 1.0 with the relative model,
    # 0.9 / 0.8 / 2.5 with this one -- the signature is of order 0.2-1.7 N
    # either way, because the cell sees the 5 kg handle while the transmission
    # moves 70 kg.  That is the platform, not the noise model.
    # ESTIMATE (R5_Q Q-10): 0.25 N is the order of an Axia90's force-axis
    # resolution; this cell's calibration sheet, or a still recording of the real
    # sensor, would replace it.
    ft_noise_rel: 0.0                # N per N of reading
    ft_noise_abs: 0.25               # N, resolution floor
  # What the link side has that a rigid Lagrangian cannot express (R5_00
  # Sec 5.4 item 4).  The residual term does not exist to learn friction: it
  # exists to absorb everything the rigid Lagrangian cannot express -- nominal
  # inertial-parameter error, unmodelled nonlinearities, and, for the pure
  # residual class, the elasticity itself.  Friction is one member of that set
  # (R5_07 Sec 3.2, owner's correction).
  plant_extras:
    link_friction:
      # R5_07 T-16 (defect D-12): the friction background is a declared
      # experimental axis, because it decides what the comparison can see.
      # Both model classes absorb friction, so it is *shared background* and
      # the one term being moved between them (the elasticity) has to stand
      # out against it.
      #
      #   off        no link friction.  The science tier: can the elastic class
      #              beat the residual class on elasticity alone?
      #   fixed      one law for every bag of every robot.  The honest default
      #              for a dataset aimed at this one machine -- a real FMRR has
      #              one friction law and memorizing it is the job -- but it is
      #              NOT a test of friction generalization, and the
      #              holdout_robots split above must not be read as one.  The
      #              manifest now says so in split.does_not_test.
      #   per_robot  drawn per robot from the factors below and logged in the
      #              link_viscous__* / link_coulomb__* columns.  The robustness
      #              tier, and the only one where a holdout claim about
      #              friction is true.  It makes the comparison harder: a
      #              pointwise model cannot infer a per-robot coefficient from
      #              one sample, so the background becomes irreducible variance
      #              rather than a learnable constant.
      #
      # Run T-13 on `off` and `fixed` at minimum and quote the friction share
      # beside every number (R5_07 Sec 3.4).
      tier: fixed
      # ESTIMATES, R5_Q Q-3, which the owner closed as a modelling decision:
      # link friction cannot be measured on this platform and is never a
      # separately identified parameter -- it is part of what the residual term
      # exists to absorb.  Order 1 % of the effort limit in Coulomb and a few N
      # per m/s viscous, for a ballscrew/linear-guide axis.  The factor is the
      # per-robot spread and is inert on the `off` and `fixed` tiers.
      viscous: {nominal: [8.0, 6.0, 5.0], factor: [0.5, 2.0]}   # N per m/s
      coulomb: {nominal: [10.0, 8.0, 6.0], factor: [0.5, 2.0]}  # N
      provenance: E
  # The top open-loop mode is 8.27 Hz at the stiffest sampled corner, which needs
  # only dt <= 6.0e-3 s for 20 samples per period.  5e-4 is kept for parity with
  # the arms and because it costs little on a 3-DoF plant (a 10 s bag runs in
  # under a second); the headroom is deliberate, not required.
  rigid_time_step: 5.0e-4
  max_time_step: 5.0e-4
  # 250 Hz, the rate the real EtherCAT master and the ROS 2 recorder run at
  # (R5_01 Amendment 1): the recorded grid must be the real one.  The
  # controller is still evaluated every physics step, standing in for the
  # drive's own kHz inner loops rather than for the 250 Hz set-point stream.
  sample_time_step: 0.004
  control_decimation: 1

visualization:
  enabled: false
  realtime_scale: 1.0
