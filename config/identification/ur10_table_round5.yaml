# Round-5 variant of the UR10 (CB3) identification config: same robot, same
# scene, same priors and same excitation as config/identification/ur10_table.yaml,
# with the four things round 5 changes (R5_00 Sec 6, R5_01 Amendment 2):
#
#   dataset.signals        motor-side position with a link-side target, the
#                          non-collocated pair elasticity is visible in
#   simulation.controller  a model-free velocity-loop cascade instead of exact
#                          computed torque
#   simulation.measurement encoder quantization, noise, gain error, delay
#   simulation.plant_extras link-side friction, so the residual term has
#                          something a Lagrangian cannot express
#
# Pass 2 kept everything a prior lives in *untouched* relative to
# ur10_table.yaml, so that a difference between the two files' datasets was a
# difference round 5 made and not a retune.  Pass 3 breaks that deliberately in
# three places, each derived below: the recording rate, the probe comb and the
# target.
#
# Pass 3 (R5_06 T-8, R5_07 T-14) makes this the *real-compatible* UR10 config:
# it records at the CB3's own 125 Hz RTDE rate with a probe band that survives
# it, and its target is the flange force/torque cell the owner confirmed will be
# fitted.  config/identification/ur10_table.yaml stays the 500 Hz / 150 Hz
# simulation-only variant, unchanged.
#
# schema_version: 2 declares a config written in round 5, which makes
# `probe_top_hz <= 0.25 * sample_rate` a load-time error instead of a
# build-time warning (R5_06 T-8).  This file clears it: 30 <= 0.25 * 125.
schema_version: 2

# ur10_table with the flange cell and its calibration payload fitted; see
# assets/robots/ur10_table_ft/asset.yaml.  The bare `ur10_table` stays exactly
# as round 4 left it, which is what keeps that round's three bare-flange
# invariants true (R5_08 D-14).
asset: ur10_table_ft

backends: [mujoco, newton]
rigid_reference: true

transmission:
  robots: 20
  sampling: stratified
  # Joint order: shoulder_pan, shoulder_lift, elbow, wrist_1, wrist_2, wrist_3.
  # UR joint sizes 4, 4, 3, 2, 2, 2.  nominal = K2 / r of the inferred
  # harmonic-drive size (32, 32, 25, 20, 20, 20), so the top of each
  # interval is the gearbox-only datasheet stiffness (R4_02 Sec 2-3).
  stiffness_nominal: [2.6e4, 2.6e4, 1.23e4, 5.7e3, 5.7e3, 5.7e3]   # Nm/rad
  # r = 3, not 2: indirect identification on a UR (no torque sensor, no
  # link encoder) and stronger nonlinearity/hysteresis (R3_04 Sec A5).
  stiffness_factor: [0.3333333333, 3.0]
  stiffness_common_fraction: 0.0
  stiffness_provenance: [D, D, D, D, D, D]
  damping_ratio: [0.05, 0.2]
  # Reflected rotor inertia [kg m^2], as armature.  Elbow (size 3) from the
  # UR5e identification (Clochiatti et al., Robotica 2024); sizes 4 and 2 by
  # power law in rated torque through the size-1/size-3 points (R4_02 Sec 4).
  rotor_inertia_nominal: [4.0, 4.0, 1.7, 0.5, 0.5, 0.5]
  rotor_inertia_factor: [0.5, 2.0]
  rotor_inertia_provenance: [E, E, C, E, E, E]
  inertia_samples: 512

# Flange tool.  tool0 == wrist_3_link on this URDF (R4_01 Sec 4), so there
# is no flange shift in offset_z (the iiwa needs +0.035 m).  Mass floor 0 keeps
# the bare-flange case -- decision D1 (R4_00 Sec 5): a floor of 0.3 kg would
# enlarge the integration step.
#
# The *variable* load, on top of the URDF's permanent 5 kg calibration payload
# (R5_07 Sec 1.2): 5 + 2 kg stays inside the UR10's 10 kg rating with margin for
# the cell's own 0.3 kg.  Pass 2's [0, 5] would have reached the rating.
payload:
  enabled: true
  mass: [0.0, 2.0]
  offset_x: [-0.08, 0.08]
  offset_y: [-0.08, 0.08]
  offset_z: [0.02, 0.20]
  size: [0.05, 0.25]
  per: robot

comparison:
  q_link_rms: 1.0e-4
  ft_relative_rms: 0.01
  deflection_relative_rms: 0.05

excitation:
  n_harmonics: 5
  base_frequency: 0.1
  n_periods: 1
  limit_margin: 0.12
  # Lower than the iiwa (0.75 / 4.0): the lift and elbow carry 2-4x the
  # iiwa's link inertia plus up to 5 kg at 1.3 m (R4_03 Sec 5).
  velocity_fraction: 0.6
  max_acceleration: 2.0
  centre_jitter: 1.0
  candidates: 48
  # URDF limits are +-2 pi on five joints; without a window, trajectory
  # centres spread over +-5.5 rad (wrap-around duplicates, upper arm under
  # the table).  Intersected with the URDF limits; limit_margin applies to
  # the window span (R4_03 Sec 1).  [R4 T2.2 -- ignored until then]
  position_window:
    shoulder_pan_joint: [-3.1416, 3.1416]
    shoulder_lift_joint: [-3.1416, 0.0]
    # T-15: pass 3 measured 13-16 % of every bag below a quarter of its own
    # median sigma_min(J), which on a target that reaches joint space through
    # J^T is information loss rather than a numerical problem -- but it is
    # material, and R5_07 T-15 asks for the window to be moved when it is.  The
    # elbow crossing zero is the stretched-arm singularity, so the window now
    # keeps the elbow bent.  Round 4's [-2.8, 2.8] is unchanged in
    # ur10_table.yaml, which has no wrench target and so nothing to lose here.
    elbow_joint: [0.35, 2.8]
    wrist_1_joint: [-3.1416, 3.1416]
    wrist_2_joint: [-3.1416, 3.1416]
    wrist_3_joint: [-3.1416, 3.1416]
  # Modal probe, 24 lines log-spaced 3-30 Hz =
  # elastic_sim.excitation.log_spaced_probe_harmonics(3.0, 30.0, 24, 0.1).
  # RE-DERIVED in pass 3 (R5_06 Sec 2.2) from the round-4 comb's 48 lines over
  # 3-150 Hz, for two reasons that both come from the recording rate below:
  #
  #  1. At the CB3's 125 Hz the differentiation bound is 0.25 * 125 = 31.25 Hz.
  #     A 150 Hz comb puts the probe's energy exactly where the consumer's
  #     Savitzky-Golay filter removes it, which is the mechanism R5_05 Sec 6.5
  #     measured behind the arms' 89-99 % differentiation share.
  #  2. What is left still covers the closed-loop proximal modes round 4
  #     measured (5-33 Hz).  The wrist modes become unobservable, which round 4
  #     already accepted for this arm.
  #
  # Halving the line count is the other half of R5_06 Sec 2.1.4's argument: the
  # per-line acceleration, not the band, is what rings the mode, so 24 lines
  # over a 10x narrower band carry far more each.
  probe_harmonics: [
    30, 33, 37, 41, 45, 49, 55, 60, 67, 74, 82, 90,
    100, 110, 122, 135, 149, 165, 182, 201, 222, 246, 271, 300,
  ]
  probe_acceleration_fraction: 0.2
  regime:
    enabled: true
    max_acceleration: [0.5, 4.0]     # rad/s^2 (iiwa [1, 8])
    velocity_fraction: [0.3, 0.8]    # (iiwa [0.3, 0.9])

dataset:
  trajectories: 3
  trajectories_per_robot: true
  # URDF damping = friction = 0 on every UR10 joint: friction sampling is a
  # no-op on this asset (R4_03 Sec 6).
  friction_samples: 1
  friction_scale: [0.5, 2.0]
  seed: 20260921
  output: data/identification/ur10_table_round5.parquet
  metadata_columns: inline
  split:
    mode: holdout_robots
    test_robots: 4
    val_robots: 2
  # The owner's signal design (R5_01 Amendment 2).  The UR10 has no link-side
  # torque sensor and no link encoder: what it reports is a motor-side position
  # and a current-derived joint torque.  The motor position is therefore the
  # real input; Q-5 asked what stands in for the link-side target on the real
  # arm, and R5_07 Sec 1 answers it -- a flange cell.
  signals:
    position_side: motor
    # R5_07 Sec 1 (owner, 2026-09-23): the real UR10 will carry an F/T cell on
    # the flange, and the arm's own reported effort can only be read as motor
    # torque.  A link-side quantity is therefore obtainable *only* as the flange
    # wrench mapped through the Jacobian, so that is the target -- the same
    # structure as FMRR's, and it must be read the same way:
    #
    #   it is NOT a joint torque sensor.  The cell measures only what is distal
    #   to it (the URDF's calibration_payload, plus any external contact force).
    #   The arm's link inertia, the gravity of links 1-6 and the joint springs
    #   themselves are proximal and therefore invisible to it.
    #
    # The elastic content of this target is m_payload * (a_true - a_rigid) at
    # the flange, which is why the payload is permanent URDF hardware and why
    # its mass was swept rather than guessed (R5_08 Sec 3).
    target: ee_wrench_joint
    # Keeps `tau_link_clean*` -- the simulated link-side torque -- in the file
    # as debug columns beside the measurable target (R5_06 T-10's treatment,
    # applied here too), so the sim-only science question can still be asked on
    # this arm without regenerating anything.
    clean_columns: true

simulation:
  # The separation bound k >= (5 omega)^2 J_eff at the soft corner of the
  # prior (k = K2/9, 2x rotor inertia, max link inertia, 5 kg payload) gives
  # omega_max ~ 7.6 rad/s on pan/lift (R4_02 Sec 7).  The iiwa's 15-40 rad/s
  # would violate it even at the nominal shoulder stiffness.
  control_frequency: 6.0
  control_damping_ratio: 1.0
  control_gains:
    enabled: true
    natural_frequency: [4.0, 7.5]   # rad/s
    damping_ratio: [0.7, 1.3]
  # Per-bag check of sqrt(k / J_eff) / omega >= min_ratio.  [R4 T2.4 --
  # ignored until then]
  control_separation:
    min_ratio: 5.0
    action: warn
  # The round-5 controller: a model-free outer position loop over the vendor's
  # inner velocity loop, reached through ur_robot_driver's velocity interface.
  # The inner loop's gains are the drive's, not ours, so they are drawn per bag
  # (R5_01 Amendment 2).  The UR10's open-loop transmission modes are 7.5-67 Hz
  # (47-420 rad/s), so a 20-60 rad/s velocity loop stays below the softest of
  # them.
  controller:
    mode: velocity_pi
    randomize: true
    velocity_loop:
      # R5_Q Q-6 (architect, 2026-09-23): widened from [20, 60] so the sampled
      # range *straddles* the transmission mode (47-420 rad/s across the sampled
      # corners) instead of staying below it.  A real drive does ring against the
      # mode, and the ringing bags are where the damping ratio becomes observable
      # at all (C5b/C5c, carried from round 4).  A per-bag stability check flags
      # the bags that ring hardest rather than dropping them.
      velocity_bandwidth: [20.0, 150.0]  # rad/s
      position_gain: [4.0, 10.0]         # 1/s (<= velocity_bandwidth / 2)
      integral_time: [0.05, 0.30]        # s
    nominal:
      knows_payload: false
  # ESTIMATES (R5_Q Q-4): a CB3 UR10 reports through RTDE, with a ~17-bit
  # absolute encoder (2 pi / 2^17 = 4.8e-5 rad), a visibly noisy velocity, and a
  # joint torque derived from motor current -- a few percent of the reading plus
  # a floor, with a per-joint calibration error that does not average out.
  measurement:
    encoder_resolution: 4.8e-5     # rad per count
    q_noise: 1.0e-5                # rad
    dq_noise: 5.0e-3               # rad/s
    tau_noise_rel: 0.03
    tau_noise_abs: 0.5             # Nm
    tau_gain_error: 0.05
    delay_samples: 1               # 8 ms at the 125 Hz grid below
    # The flange cell is a different instrument from the drives' current-derived
    # torque, so it gets its own figures, for the same structural reason FMRR's
    # does: a strain-gauge cell's noise is a resolution floor, not a fraction of
    # the reading.  CLASS E, R5_Q Q-13 (which cell, and its figures?) is open:
    # these are a generic industrial 6-axis cell's, of the order of an Axia90's
    # force resolution.
    ft_noise_rel: 0.0              # N per N of reading
    ft_noise_abs: 0.25             # N, resolution floor
  # ESTIMATES (R5_Q Q-3): output-side friction of a harmonic drive plus its
  # bearing, ~2 % of the joint's rated torque in Coulomb and ~1 Nm/(rad/s)
  # viscous.  Joint order: pan, lift, elbow, wrist 1-3.
  plant_extras:
    link_friction:
      # off | fixed | per_robot (R5_07 T-16, defect D-12).  See
      # config/identification/fmrr_tecnobody.yaml for what each tier answers;
      # the short version is that friction is background shared by both model
      # classes, `fixed` is the single-machine default and does not make the
      # holdout_robots split a test of friction, and `per_robot` is the
      # robustness tier.
      tier: fixed
      viscous: {nominal: [2.0, 2.0, 1.0, 0.4, 0.4, 0.4], factor: [0.5, 2.0]}  # Nm per rad/s
      coulomb: {nominal: [6.6, 6.6, 3.0, 1.1, 1.1, 1.1], factor: [0.5, 2.0]}  # Nm
      provenance: E
  rigid_time_step: 5.0e-4
  max_time_step: 5.0e-4
  # 125 Hz: the rate RTDE actually runs at on a CB3 (R5_Q Q-4), so the recorded
  # grid is the real one.  Pass 2 kept 500 Hz because the round-4 probe band and
  # a faithful rate are incompatible -- R5_06 Sec 2.2 resolves it by moving the
  # probe (above), not the rate, since the rate is a fact about the robot and
  # the comb is ours.  The cost is stated in the contract: this dataset sees
  # only the arm's proximal modes.
  sample_time_step: 0.008
  control_decimation: 1

visualization:
  enabled: false
  realtime_scale: 1.0
