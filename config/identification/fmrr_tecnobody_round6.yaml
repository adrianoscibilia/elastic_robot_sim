# Round-6 production config for the FMRR Tecnobody gantry (R6_00).
#
# The soft member of the round-6 family; see
# kuka_lbr_iiwa_14_r820_table_round6_drive.yaml for what the three configs share.
# Prismatic axes: stiffness in N/m, "rotor inertia" is a reflected mass [kg],
# torque is force [N].  Joint order y, x, z (the URDF's chain order).
#
# The asset keeps its F/T cell: the wrench columns w_* stay in the file for the
# post-training chain, computed from the link state with the contract's
# Savitzky-Golay acceleration (R6_00 Sec 5.5).  The target is tau_s.
schema_version: 3

asset: fmrr_tecnobody

backends: [mujoco]
rigid_reference: true

transmission:
  robots: 12
  sampling: stratified
  stiffness_nominal: [7162.0, 5977.0, 3861.0]     # N/m, legacy sim2real calibration [I-5]
  stiffness_factor: [0.5, 2.0]
  stiffness_common_fraction: 0.0
  stiffness_provenance: [C, C, C]
  damping_ratio: [0.4, 1.2]
  rotor_inertia_nominal: [1.178, 1.178, 19.236]   # kg, J / r^2 through the measured leads [I-2, I-3]
  rotor_inertia_factor: [0.5, 2.0]
  rotor_inertia_provenance: [E, E, E]
  inertia_samples: 64

payload:
  enabled: true
  mass: [0.0, 2.0]
  offset_x: [-0.02, 0.02]
  offset_y: [-0.02, 0.02]
  offset_z: [-1.11, -1.04]
  size: [0.05, 0.15]
  per: robot

comparison:
  q_link_rms: 1.0e-4
  ft_relative_rms: 0.01
  deflection_relative_rms: 0.05

excitation:
  n_harmonics: 5
  base_frequency: 0.1
  n_periods: 1
  limit_margin: 0.12
  velocity_fraction: 0.6
  # R6_04 A-7: raised until peak |tau|/effort would reach 0.8, capped at
  # 2.0 m/s^2 (4x the URDF's 0.5): simulation may excite more than the real
  # machine, with faithful physics.  The peak reaches only 0.40 at the cap
  # (reports/round6/acceleration_fmrr_tecnobody_round6.json).
  max_acceleration: 2.0             # m/s^2
  centre_jitter: 1.0
  candidates: 48
  # R6_02 P2-1: the comb is aimed at the link-side modes, derived at load from
  # the f_link table (elastic_sim.link_modes): log-spaced lines from
  # min(lowest_hz, 0.5 f_link,low) to min(1.5 f_link,high, 0.09 x rate), the
  # consumer's derivative passband [S-12, S-14].  The resolved harmonics and
  # the table are in the manifest.
  probe_design:
    source: link_modes
    lowest_hz: 1.5
    lines: 32
    span: [0.5, 1.5]
  # R6_04 D-1: the probe is added on top of the main trajectory's full
  # acceleration budget (workspace coverage unchanged); its share is raised
  # until peak |tau|/effort reaches 0.8 or it equals the main budget
  # (scripts/round6_probe_fraction.py, reports/round6/fraction_*).
  probe_budget: additive
  probe_acceleration_fraction: 1.0   # sweep: reports/round6/fraction_<stem>.json
  regime:
    enabled: true
    max_acceleration: [0.15, 2.0]      # upper bound raised with the main budget (A-7)
    velocity_fraction: [0.3, 0.8]

dataset:
  trajectories: 3
  trajectories_per_robot: true
  friction_samples: 1
  friction_scale: [0.5, 2.0]
  seed: 20260930
  output: data/identification/fmrr_tecnobody_round6.parquet
  metadata_columns: inline
  split:
    mode: holdout_robots
    test_robots: 3
    val_robots: 2
  signals:
    position_side: motor
    target: link_torque
    target_source: measured
    clean_columns: true
    wrench_columns: true

simulation:
  # Recorded at the 250 Hz EtherCAT rate; the loop is in the drive (below).
  controller:
    mode: pd
    randomize: true
    # R6_02 Sec 7 amended [I-8], R6_04 A-1: the ROS 2 controller sends
    # position/velocity setpoints (CSP/CSV); the PD lives in the ASDA drive at
    # 4 kHz, d = 0, gains on J + m_nom (the moved masses), setpoints one bus
    # sample late.  omega_max = 0.5 / (2 * 1.3 * 2.5e-4) = 769 rad/s, scaled
    # per axis by J / (J + m) (rotor-referred bound, R6_04 A-2).
    location: drive
    drive: {rate: 4000.0, bound: rotor, setpoint_delay: 1, velocity_cutoff_fraction: 0.1}
    gain_sizing: motor_plus_load
    loop: sample_rate
    nominal:
      knows_payload: false
  control_gains:
    enabled: true
    natural_frequency_fraction: [0.5, 0.9]
    damping_ratio: [0.7, 1.3]
  control_separation:
    min_ratio: 5.0
    action: warn
  motor_friction:
    viscous_fraction: 0.05
    coulomb_fraction: 0.02
    epsilon: 1.0e-2              # m/s
    per_robot: true
    provenance: E
  noise:
    enabled: true
    delay_samples: 1             # one 4 ms EtherCAT sample
    q:
      # R6_02 Sec 3: an encoder is quantization plus one count of white noise,
      # not a percentage of RMS (0.01 % of RMS was ~800 iiwa counts).
      quantization: [2.381e-8, 2.381e-8, 1.190e-8]   # m per count, 0x6064 [I-2]
      sigma_quanta: 1.0
    dq:
      source: sensor             # 0x606C, the drive's estimate
      p: 0.005
      quantization: [5.079e-5, 5.079e-5, 2.539e-5]   # m/s, 0.1 rpm units [I-2]
    ft:
      p: 0.02
      gain: 0.02
      offset: 0.005
      # 0x6077 in 0.1 % of rated torque (1.27 / 2.39 Nm [I-3]) through r [I-2]
      quantization: [0.26, 0.26, 0.99]
    # The Axia90 handle cell (round-5 figures, R5_Q Q-10): a resolution floor
    # and a calibration spread, for the w_* columns only.
    wrench:
      sigma: 0.25
      gain: 0.03
    tag: modelling_error
    provenance: E
  plant_extras:
    link_friction:
      tier: fixed
      viscous: {nominal: [8.0, 6.0, 5.0], factor: [0.5, 2.0]}   # N per m/s
      coulomb: {nominal: [10.0, 8.0, 6.0], factor: [0.5, 2.0]}  # N
      provenance: E
      integration: implicit
    # No nonlinear spring: the compliance is structural (frame, belts, screws),
    # with no documented knee (R6_00 Sec 5.2).
    # R6_00 Sec 5.3, class E [I-2]: motor torque ripple, one line per motor
    # revolution, 2 pi / lead; 1 % of the axis effort limit; phase per bag.
    torque_ripple:
      amplitude: 0.01
      order: [206.19, 206.19, 412.58]   # rad per m of axis travel
      random_phase: true
      provenance: E
  # Derived at load from the Sec 3 bound table (R6_02 Sec 6), capped at 5e-4 s.
  rigid_time_step: auto
  max_time_step: auto
  sample_time_step: 0.004        # 250 Hz EtherCAT

gates:
  sag_max_fraction: 0.05
  # R6_04 A-1 stop condition: under `drive` the drive tracks the motor to
  # <= 2 % of span on every axis, but the link-side z sag is the spring's
  # static deflection under gravity, (m_z + payload) g / K_z (up to 12 % on a
  # small-span bag), which no motor-side loop can remove.  Reported, not gated.
  sag_mode: report
  sag_reason: "R6_04 A-1: FMRR drive sag > 5 % only on z, where it is the spring's static gravity deflection; motor-side sag <= 2 % (records[].sag_motor_fraction)"
  # R6_02 Sec 7 amended: a drive dataset compares with round 5's velocity_pi row.
  qc_v2_reference: {elastic: 0.0442, rigid: 0.00723, source: "reports/round5/qc2_fmrr_summary.csv, velocity_pi, extras on"}
  unstable_max_fraction: 0.02
  gainshift_fraction: [[0.3, 0.5], [0.9, 1.0]]
  gainshift_max_ratio: 1.3

visualization:
  enabled: false
  realtime_scale: 1.0
