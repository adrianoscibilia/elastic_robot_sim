# Shared base for the iiwa sim-to-real stages (S2R_01 §7, §9).
# Stage configs (iiwa_s0_static.yaml ... iiwa_s4_twin.yaml) extend this file.
schema: elastic_sim.sim2real/1
asset: kuka_lbr_iiwa_14_r820
plant_base: config/identification/kuka_lbr_iiwa_14_r820_table_round6_drive.yaml
runs:
  A:
    path: data/real_robot/kuka_lbr_iiwa_14_r820/20261014/iiwa_real_all_01
    sha256: b277535927041656978b4316ddffe79440e3cfb10e11cf2f1dc17259dffa7cfd
  B:
    path: data/real_robot/kuka_lbr_iiwa_14_r820/20261014/iiwa_fast_all_01
    sha256: 9174356701f0d4b6756cf0585508b83446769b95f5f54c81f00546431279552d
segments: [excitation, identify_excitation, hold]
# Primary split, S2R_06 A-13 (owner D-7: per-session zero). Training never
# sees test-run data except the sensor zero: after the stage fit, only
# sensor.ft.*.offset@A is fitted on A's holds (`zero`), everything else
# frozen. Offsets of a run with no training bag are excluded from the free
# set automatically. The mirror stages (iiwa_s*_mirror.yaml) swap A and B.
split:
  train: ["B:excitation_[0-6]", "B:identify_hold_*"]
  val: ["B:excitation_[7-9]", "B:identify_excitation_0"]
  zero: ["A:identify_hold_*"]
  test: ["A:excitation_*", "A:identify_excitation_0"]
# S2R_08 A-12' / F-2: one d_post on the full free set at the result labels
# each parameter calibrated (>= 0.9) or not; values are never changed.
# mode: freeze_refit is S2R_06's A-12 (the owner's overrule).
identifiability: {mode: label, d_post_min: 0.9, partner_min: 0.5}
output: data/sim2real/kuka_lbr_iiwa_14_r820

# Parameter registry v2 (S2R_01 §5, T-2.1). Names: <group>.<subject>.<field>[@<run>],
# expanded against the asset, plant_base and runs; the last matching pattern wins.
# `mean` omitted = the asset's URDF value or the round-6 plant_base nominal.
# Bounds: `bounds` absolute, `factor` x mean, `offset` + mean; `values` = discrete
# (outer grid, never free). sigma is in the parameter's scale (log-sigma for log).
# S2R_02 A-1: K, D and the extras stay frozen at their priors in every stage.
parameters:
  free: ["inertial.*.mass", "inertial.*.com_*", "inertial.*.inertia_scale",
         "friction.link.*.*", "sensor.ft.*.offset@*", "sensor.ft.*.gain"]
  frozen: ["transmission.*.*", "extras.*"]
  priors:
    "inertial.*.mass":
      {scale: log, factor: [0.6, 1.8], sigma: 0.2, provenance: "LBR-Stack URDF; range from FR_05 F-2 (A2/A4 gravity +14-17 %)"}
    "inertial.*.com_*":
      {scale: linear, offset: [-0.05, 0.05], sigma: 0.02, provenance: "LBR-Stack URDF; gravity sees m*c (base-parameter combinations)"}
    "inertial.*.inertia_scale":
      {scale: log, bounds: [0.5, 2.0], sigma: 0.3, provenance: "uniform scale of the URDF tensor (keeps it physical)"}
    "friction.link.*.viscous":
      {scale: log, factor: [0.002, 20.0], sigma: 1.0, provenance: "round-6 link_friction.viscous.nominal (PARAMETER_PROVENANCE, class E); box widened below, mean unchanged (S2R_06 F-5)"}
    "friction.link.*.coulomb":
      {scale: log, factor: [0.002, 20.0], sigma: 1.0, provenance: "round-6 link_friction.coulomb.nominal (class E), box widened below, mean unchanged (S2R_06 F-5); epsilon 1e-3 fixed (identification.COULOMB_EPSILON, the production PlantExtras.epsilon; S2R_04 A-8)"}
    "sensor.ft.*.offset@*":
      {mean: 0.0, scale: linear, offset: [-2.0, 2.0], sigma: 0.5, provenance: "run-scoped JTS offset (S2R_01 §5)"}
    "sensor.ft.iiwa_A[5-7].offset@*":
      {offset: [-1.0, 1.0]}
    "sensor.ft.*.gain":
      {mean: 1.0, scale: linear, bounds: [0.95, 1.05], sigma: 0.01, provenance: "KUKA model ~ sensor within 1 % (FR_05 F-2)"}
    "transmission.*.stiffness":
      {scale: log, factor: [0.5, 2.0], sigma: 0.35, modes: [R0, R1, R2], provenance: "round-6 stiffness_nominal; frozen on A/B (S2R_00 §7)"}
    "transmission.*.damping_ratio":
      {mean: 0.1, scale: log, bounds: [0.05, 0.2], sigma: 0.5, modes: [R1, R2], provenance: "round-6 damping_ratio interval centre; frozen on A/B"}
    "transmission.*.rotor_inertia":
      {scale: log, factor: [0.5, 2.0], sigma: 0.35, modes: [R2], provenance: "round-6 rotor_inertia_nominal"}
    "friction.motor.*.*":
      {scale: log, factor: [0.2, 5.0], sigma: 0.7, modes: [R2], provenance: "round-6 motor-friction rule (R6_00 Sec 5.4); invisible to ft"}
    "extras.transmission_error.amplitude":
      {scale: linear, bounds: [0.0, 4.0e-4], modes: [R1, R2], provenance: "round-6 value [S-1]; frozen until a probe file exists"}
    "extras.stiffness_nonlinearity.*":
      {scale: linear, factor: [0.5, 2.0], modes: [R1, R2], provenance: "round-6 HD curve factors; frozen until a probe file exists"}
    "controller.*.bandwidth":
      {mean: 62.83185307179586, scale: log, bounds: [12.566370614359172, 376.99111843077515], sigma: 0.7, modes: [R2], provenance: "first guess 2 pi 10 rad/s; S4 identifies it"}
    "controller.iiwa_A*.damping_ratio":
      {mean: 1.0, scale: linear, bounds: [0.4, 2.0], sigma: 0.3, modes: [R2], provenance: "critically damped first guess"}
    "controller.model_scale":
      {mean: 1.0, scale: linear, bounds: [0.7, 1.3], sigma: 0.1, modes: [R2], provenance: "nominal model = plant x model_scale"}
    "controller.delay_cycles":
      {mean: 1, values: [0, 1, 2, 3, 4, 5], modes: [R2], provenance: "discrete: outer grid"}
    "controller.drive_rate":
      {mean: 4000.0, values: [1000.0, 2000.0, 4000.0, 8000.0], modes: [R2], provenance: "discrete: outer grid (Hz)"}
