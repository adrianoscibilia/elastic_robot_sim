elastic_drives:
  drive_x:
    damping_ratio: 0.49
    stiffness: 5977.08
  drive_y:
    damping_ratio: 0.68
    stiffness: 7162.08
  drive_z:
    damping_ratio: 1.2
    stiffness: 3861.11
  payload: 0.0

simulation:
  ref_mode: 2       # 0=hold  1=sinusoidal  2=PTP
  seed: -1          # -1 = random
  sim_time: 15.0    # seconds
  time_step: 0.01   # integration step (s)
  cut_off_time: 2.0 # seconds to skip at start of comparisons

# -----------------------------------------------------------------------
# Everything that shapes a trajectory lives here. No trajectory-shaping
# literal may exist in .py files (O1 / INV-2).
# -----------------------------------------------------------------------
trajectory:
  # Position limits per prismatic axis (meters). Used for both amplitude
  # clamping (sin) and waypoint sampling (ptp). Single source of truth.
  joint_limits:
    x: [-1.8, 1.8]
    y: [-1.8, 1.8]
    z: [-1.0, 1.0]

  # --- Velocity / speed governance ------------------------------------
  # Desired Cartesian peak speed cap (m/s). The auto override guarantees the
  # executed peak velocity never exceeds this.
  peak_cartesian_velocity_ms: 0.5

  # Optional per-axis velocity caps (m/s). null = no per-axis cap;
  # only the Cartesian peak applies.
  axis_velocity_limits_ms:
    x: null
    y: null
    z: null

  # Startup ramp time constant (s): ramp = 1 - exp(-t / ramp_tau).
  ramp_tau: 1.0

  # --- Sinusoidal mode shape parameters --------------------------------
  sinusoidal:
    amplitude_fraction: 0.4    # max amp = (hi-lo) * amplitude_fraction
    amplitude_min_m: 0.2       # min amp (m); must be < max amp
    freq_min: 0.5              # rad/s
    freq_max: 3.0              # rad/s

  # --- PTP mode shape parameters ---------------------------------------
  ptp:
    step_duration: 2.0         # s per segment (nominal, before speed scaling)
    min_distance: 0.2          # m, minimum spacing between consecutive waypoints

  # --- Execution / sampling density ------------------------------------
  # Points per PTP segment when building the ROS FollowJointTrajectory goal.
  ros_points_per_segment: 20

# -----------------------------------------------------------------------
# Data collection. speed_override is the USER cap; default 100 = deactivated.
# -----------------------------------------------------------------------
collection:
  num_trajectories: 10      # 0 = run until Ctrl-C
  modes:                    # trajectory modes to randomly sample
    - sin                   # sinusoidal
    - ptp                   # point-to-point with cubic blending
  sim_time: 15.0            # seconds per trajectory
  master_seed: null         # null = random; set an integer for reproducible sessions
  joint_limits:
    x: [-0.7, 0.7]          # meters
    y: [-0.7, 0.8]
    z: [-0.2, 0.25]
  payload: 0.0              # kg attached to end-effector during collection
  output_dir: data/recordings/session_latest  # default output directory
  ft_topic: /ft_sensor_command_broadcaster/wrench
  speed_override: 50        # % of nominal trajectory speed (1–100); start low!
