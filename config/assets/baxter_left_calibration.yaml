# This is the only robot-specific calibration content: asset identity,
# ordered joint mapping, data path and physical priors.  The runner, metric
# and optimizer are shared with every asset.
asset: ../../assets/robots/baxter/asset.yaml
dataset: ../../data/processed/baxter_left.parquet
joint_names: [left_s0, left_s1, left_e0, left_e1, left_w0, left_w1, left_w2]
runner_factory: elastic_sim.generic_newton_runner:make_torque_replay_runner
train_fraction: 0.8
metric_weights:
  position: 1.0
  velocity: 0.3
  motor_position: 0.0
  motor_velocity: 0.0
optimizer:
  name: cma
  sigma0: 0.3
  max_evals: 300
parameters:
  - {name: left_s0.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_s0.damping, lower: 0.01, upper: 1000.0}
  - {name: left_s1.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_s1.damping, lower: 0.01, upper: 1000.0}
  - {name: left_e0.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_e0.damping, lower: 0.01, upper: 1000.0}
  - {name: left_e1.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_e1.damping, lower: 0.01, upper: 1000.0}
  - {name: left_w0.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_w0.damping, lower: 0.01, upper: 1000.0}
  - {name: left_w1.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_w1.damping, lower: 0.01, upper: 1000.0}
  - {name: left_w2.stiffness, lower: 10.0, upper: 100000.0}
  - {name: left_w2.damping, lower: 0.01, upper: 1000.0}
