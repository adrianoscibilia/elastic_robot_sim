# KUKA raw recordings expose separate motor and secondary/link encoders.  This
# is the preferred real-world source for identifying elastic transmissions.
asset: ../../assets/robots/kuka_kr300/asset.yaml
dataset: ../../assets/datasets/kuka_kr300/raw/raw_data
dataset_format: kuka_raw_mat
joint_names: [a1, a2, a3, a4, a5, a6]
runner_factory: elastic_sim.generic_newton_runner:make_torque_replay_runner
train_fraction: 0.8
metric_weights:
  position: 1.0
  velocity: 0.3
  motor_position: 0.2
  motor_velocity: 0.1
optimizer:
  name: cma
  sigma0: 0.3
  max_evals: 300
parameters:
  - {name: a1.stiffness, lower: 100.0, upper: 1000000.0}
  - {name: a1.damping, lower: 0.1, upper: 10000.0}
  - {name: a2.stiffness, lower: 100.0, upper: 1000000.0}
  - {name: a2.damping, lower: 0.1, upper: 10000.0}
  - {name: a3.stiffness, lower: 100.0, upper: 1000000.0}
  - {name: a3.damping, lower: 0.1, upper: 10000.0}
  - {name: a4.stiffness, lower: 10.0, upper: 100000.0}
  - {name: a4.damping, lower: 0.01, upper: 1000.0}
  - {name: a5.stiffness, lower: 10.0, upper: 100000.0}
  - {name: a5.damping, lower: 0.01, upper: 1000.0}
  - {name: a6.stiffness, lower: 10.0, upper: 100000.0}
  - {name: a6.damping, lower: 0.01, upper: 1000.0}
