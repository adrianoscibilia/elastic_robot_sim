# erd.lab/1 -- KUKA LBR iiwa 14 R820, REAL ROBOT.
#
# The reviewed template (RR_01 S4, RR_04 B-4): `hardware: real`, domain 0.
# `load_lab_config` REFUSES this file as-is -- `limits.reviewed`/
# `scene.reviewed` are false and several measured values are still `null` or
# placeholders, on purpose, until T2.0 fills them in. Do not flip `reviewed`
# to true without measuring the cell and reviewing every value below.
#
# Known facts filled in from I-10/I-12 (pendant photos, 2026-09-29) and the
# ICube station project; everything else needs T2.0. Per-joint
# position/velocity/acceleration/jerk limits are `null` (the loader accepts
# that: RR_01 S4's own template shows the same). Scene coordinates cannot be
# `null` structurally (the loader parses them as numbers immediately, unlike
# the per-joint limits), so they carry an obvious zero-ish placeholder
# instead, guarded by `scene.reviewed: false` -- never trust these numbers.
schema: erd.lab/1
robot: kuka_lbr_iiwa_14_r820
hardware: real                          # mock | emulator | real
operator: {confirm_each_trajectory: true}

connection:
  robot_ip: 192.170.10.2                # KONI (I-10)
  client_ip: 192.170.10.5               # this PC on the KONI network, via the USB adapter (I-10)
  fri_port: 30200
  fri_send_period_ms: 1                 # must equal ErdFri.java's setSendPeriodMilliSec (RR_01 S3.3)
  sunrise_version: 1.11.0.7             # I-12
  ros_domain_id: 0                      # real always uses domain 0 (RR_01 S9)

description:
  sim_asset: kuka_lbr_iiwa_14_r820        # the BARE asset (RR_04 A-6): planning, FK gate and baselines
                                          # never use the `_table` variant, which is a different URDF root
  joint_map: {joint_a1: iiwa_A1, joint_a2: iiwa_A2, joint_a3: iiwa_A3, joint_a4: iiwa_A4,
              joint_a5: iiwa_A5, joint_a6: iiwa_A6, joint_a7: iiwa_A7}
  base_frame: iiwa_base
  tool:
    mass: 0.0                           # nothing mounted (owner, Q-13); the Media Flange is part of the robot
    extra_collision:                    # measure; margin for the MF if the URDF mesh lacks it
      - {shape: cylinder, height: 0.03, radius: 0.045, parent: iiwa_link_ee, xyz: [0, 0, 0.015], rpy: [0, 0, 0]}

limits:                                 # real caps for excitation -- T2.0 measures and reviews every one
  reviewed: false
  position:
    iiwa_A1: null
    iiwa_A2: null
    iiwa_A3: null
    iiwa_A4: null
    iiwa_A5: null
    iiwa_A6: null
    iiwa_A7: null
  velocity:
    iiwa_A1: null
    iiwa_A2: null
    iiwa_A3: null
    iiwa_A4: null
    iiwa_A5: null
    iiwa_A6: null
    iiwa_A7: null
  acceleration:
    iiwa_A1: null
    iiwa_A2: null
    iiwa_A3: null
    iiwa_A4: null
    iiwa_A5: null
    iiwa_A6: null
    iiwa_A7: null
  jerk:
    iiwa_A1: null
    iiwa_A2: null
    iiwa_A3: null
    iiwa_A4: null
    iiwa_A5: null
    iiwa_A6: null
    iiwa_A7: null
  effort:                               # N*m [S-13, verify against the pendant/Sunrise project before T2.0]
    iiwa_A1: 320
    iiwa_A2: 320
    iiwa_A3: 176
    iiwa_A4: 176
    iiwa_A5: 110
    iiwa_A6: 40
    iiwa_A7: 40
  approach: {velocity: 0.1, acceleration: 0.2}   # conservative; T2.1 (ladder step 3) tunes these
  abort: {tracking_rad: 0.03, torque_fraction: 0.6, stop_timeout_s: 3.0}   # conservative; RR_01 S9

scene:                                  # ALL PLACEHOLDER until T2.0 measures the real cell
  reviewed: false
  frame: iiwa_base
  clearance: 0.05                       # wider than the mock/sim templates' 0.03 until the cell is measured
  objects:
    - {id: floor, type: floor, z: 0.0}                                                            # PLACEHOLDER
    - {id: table, type: table, top_z: 0.0, centre_xy: [0.0, 0.0], size_xy: [1.0, 1.0], thickness: 0.05}  # PLACEHOLDER
    - {id: wall_behind, type: wall, point: [-1.0, 0.0, 0.0], normal: "-x", size: [3.0, 3.0], thickness: 0.2}  # PLACEHOLDER
    - {id: ceiling, type: ceiling, z: 3.0}                                                         # PLACEHOLDER
  allowed_contacts: [[iiwa_link_0, table]]   # base on its mount

poses:                                  # PLACEHOLDER (same shape as iiwa_mock.yaml) until T2.0 measures the cell
  home: [0.0, 0.3, 0.0, -1.2, 0.0, 0.8, 0.0]
  standstill:
    - [0.0, 0.3, 0.0, -1.2, 0.0, 0.8, 0.0]
    - [0.5, 0.2, 0.3, -1.0, 0.2, 0.9, 0.3]
    - [-0.5, 0.4, -0.3, -1.4, -0.2, 0.7, -0.3]

excitation:
  trajectories: 10
  seed: 20261001
  base_frequency: 0.1
  n_periods: 1
  n_harmonics: 5
  velocity_fraction: 0.6
  max_acceleration: 1.5
  centre_jitter: 1.0
  position_window: {}
  candidates: 48
  regime:
    enabled: true
    velocity_fraction: [0.3, 1.0]
    max_acceleration: [0.25, 1.0]
  probe:
    enabled: false                      # commissioning; may switch on once the ladder (S7.2) is past step 6
    # RR_12 S4.4: off until rung 7; capped at 90 Hz (= 0.09 x 1000 Hz).
    from_training_config: ${ERD_REPO_ROOT}/config/identification/kuka_lbr_iiwa_14_r820_table_round6_drive.yaml
    max_top_hz: 90.0
    acceleration_fraction: 0.2
    budget: split                       # never additive on hardware
  settle_s: 2.0
  amplitude_ladder: [0.1, 0.25, 0.5, 1.0]

identification:
  sweep_speeds: []                      # UR10-only fields; iiwa uses E-iiwa-1/2 instead (RR_01 S2.1)
  sweep_range: {}
  holdout: 2

safety:
  vendor_checksum: null              # T2.0: Sunrise safety configuration checksum (Safety > Configuration on the pendant) (RR_12 A-3c)

consumer:
  repo: ${ERD_CONSUMER_REPO}                 # exported by workspace_setup.sh (default: ../dynamic_model_nn)
  python: ${ERD_CONSUMER_PYTHON}   # confirmed consumer env, Python 3.11
  # RR_12 S4.4: the round-6 `iiwa_drive` production contract (Q-1 = POSITION ->
  # `drive`) and its sibling .manifest.json, copied to the same relative path
  # on the laptop (T2.0-lab item 2). The synthetic reference stays in *_sim.yaml.
  reference_contract: ${ERD_REPO_ROOT}/data/identification/r6-full-20260929-0049/iiwa_drive/kuka_lbr_iiwa_14_r820_table_round6_drive.contract.json
  reference_sha256: c64f7aef2e1e0f4625c1fea7d72ef052f8e045a0e09b257c2ebf04225bb5ea25
  checkpoints: ${ERD_REPO_ROOT}/runs/r6-full-20260929-0049/chain-iiwa_drive.summary.csv   # evaluate (peepo)

recording:
  output_root: ${ERD_DATA_ROOT}                # <repo>/data/real_robot, exported by workspace_setup.sh (gitignored)
  standstill_s: 30
  pre_roll_s: 2.0
  post_roll_s: 2.0
  max_lost_fraction: 0.001
