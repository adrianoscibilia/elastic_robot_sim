# erd.lab/1 -- UR10 CB3, REAL ROBOT.
#
# The reviewed template (RR_01 S4, RR_04 B-4): `hardware: real`, domain 0.
# `load_lab_config` REFUSES this file as-is -- `limits.reviewed`/
# `scene.reviewed` are false and several measured values are still `null` or
# placeholders, on purpose, until T2.0 fills them in. Do not flip `reviewed`
# to true without measuring the cell and reviewing every value below.
#
# Known facts filled in from I-12 (pendant photos, 2026-09-29); everything
# else needs T2.0. Per-joint position/velocity/acceleration/jerk limits are
# `null` (the loader accepts that). Scene coordinates cannot be `null`
# structurally, so they carry an obvious zero-ish placeholder instead,
# guarded by `scene.reviewed: false` -- never trust these numbers.
schema: erd.lab/1
robot: ur10_cb3
hardware: real                          # mock | ursim | real
operator: {confirm_each_trajectory: true}

connection:
  robot_ip: 192.168.56.10               # I-12 (hostname ur-2017307500)
  reverse_ip: 192.168.56.1              # this PC on the robot's network -- verify at T2.0
  headless_mode: false                  # real: a pendant program runs External Control (S-17)
  kinematics_params_file: null          # T2.5: from `ur_calibration` against this serial
  servoj_gain: 2000
  servoj_lookahead_time: 0.03
  rtde_frequency: 125
  software_version: 3.15.7.106331       # I-12
  serial: "2017307500"                  # I-12
  ros_domain_id: 0                      # real always uses domain 0 (RR_01 S9)

description:
  sim_asset: ur10                        # the BARE asset (RR_04 A-6): planning, FK gate and baselines
                                          # never use the `_table` variant, which is a different URDF root
  joint_map:
    shoulder_pan_joint: shoulder_pan_joint
    shoulder_lift_joint: shoulder_lift_joint
    elbow_joint: elbow_joint
    wrist_1_joint: wrist_1_joint
    wrist_2_joint: wrist_2_joint
    wrist_3_joint: wrist_3_joint
  base_frame: base_link                 # pendant coordinates are in `base` = Rz(pi) of this (RR_01 S3.4)
  tool:
    mass: 0.0                           # nothing mounted (owner, Q-13)
    extra_collision: []

limits:                                 # real caps for excitation -- T2.0 measures and reviews every one
  reviewed: false
  position:
    shoulder_pan_joint: null
    shoulder_lift_joint: null
    elbow_joint: null
    wrist_1_joint: null
    wrist_2_joint: null
    wrist_3_joint: null
  velocity:
    shoulder_pan_joint: null
    shoulder_lift_joint: null
    elbow_joint: null
    wrist_1_joint: null
    wrist_2_joint: null
    wrist_3_joint: null
  acceleration:
    shoulder_pan_joint: null
    shoulder_lift_joint: null
    elbow_joint: null
    wrist_1_joint: null
    wrist_2_joint: null
    wrist_3_joint: null
  jerk:
    shoulder_pan_joint: null
    shoulder_lift_joint: null
    elbow_joint: null
    wrist_1_joint: null
    wrist_2_joint: null
    wrist_3_joint: null
  effort:                               # N*m [S-6, verify before T2.0]
    shoulder_pan_joint: 330
    shoulder_lift_joint: 330
    elbow_joint: 150
    wrist_1_joint: 56
    wrist_2_joint: 56
    wrist_3_joint: 56
  approach: {velocity: 0.1, acceleration: 0.2}   # conservative; T2.5 (ladder step 3) tunes these
  abort: {tracking_rad: 0.03, torque_fraction: 0.6, stop_timeout_s: 3.0}   # conservative; RR_01 S9

scene:                                  # ALL PLACEHOLDER until T2.0 measures the real cell
  reviewed: false
  frame: base_link
  clearance: 0.05                       # wider than the mock/sim templates' 0.03 until the cell is measured
  objects:
    - {id: floor, type: floor, z: 0.0}                                                            # PLACEHOLDER
    - {id: table, type: table, top_z: 0.0, centre_xy: [0.0, 0.0], size_xy: [1.0, 1.0], thickness: 0.05}  # PLACEHOLDER
    - {id: wall_behind, type: wall, point: [-1.0, 0.0, 0.0], normal: "-x", size: [3.0, 3.0], thickness: 0.2}  # PLACEHOLDER
    - {id: ceiling, type: ceiling, z: 3.0}                                                         # PLACEHOLDER
  allowed_contacts: []

poses:                                  # PLACEHOLDER (same shape as ur10_mock.yaml) until T2.0 measures the cell
  home: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  standstill:
    - [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
    - [0.3, -1.3, 1.3, -1.5, -1.2, 0.3]
    - [-0.3, -1.8, 1.7, -1.7, -1.8, -0.3]

excitation:
  trajectories: 10
  seed: 20261001
  base_frequency: 0.1
  n_periods: 1
  n_harmonics: 5
  velocity_fraction: 0.6
  max_acceleration: 1.0
  centre_jitter: 1.0
  position_window: {}
  candidates: 48
  regime:
    enabled: true
    velocity_fraction: [0.3, 1.0]
    max_acceleration: [0.25, 1.0]
  probe:
    enabled: false
    # RR_12 S4.4: off until rung 7; capped at 11 Hz (the SG bound at 125 Hz is 11.25 Hz).
    from_training_config: ${ERD_REPO_ROOT}/config/identification/ur10_table_round6.yaml
    max_top_hz: 11.0
    acceleration_fraction: 0.2
    budget: split
  settle_s: 2.0
  amplitude_ladder: [0.1, 0.25, 0.5, 1.0]

identification:
  sweep_speeds: [0.05, 0.1, 0.2, 0.35, 0.5, 0.7]   # capped at limits.velocity once measured
  sweep_range:
    shoulder_pan_joint: [-1.0, 1.0]
    shoulder_lift_joint: [-1.0, -0.5]
    elbow_joint: [1.0, 2.0]
    wrist_1_joint: [-2.0, -1.0]
    wrist_2_joint: [-2.0, -1.0]
    wrist_3_joint: [-1.0, 1.0]
  holdout: 2

safety:
  vendor_checksum: null              # T2.0: PolyScope safety checksum (top-right of the pendant, Installation > Safety) (RR_12 A-3c)

consumer:
  repo: ${ERD_CONSUMER_REPO}                 # exported by workspace_setup.sh (default: ../dynamic_model_nn)
  python: ${ERD_CONSUMER_PYTHON}               # consumer env (Python 3.11)
  # RR_12 S4.4: the round-6 `ur10_table_round6` production contract and its
  # sibling .manifest.json (T2.0-lab item 2). Training ran at 500 Hz, so the
  # 125 Hz real file is a declared rate gap (RR_02 CR-2).
  reference_contract: ${ERD_REPO_ROOT}/data/identification/r6-ur10-20261005-1126/ur10/ur10_table_round6.contract.json
  reference_sha256: cc8867e909b0e9804df29b4645cabb954991fe99c7c0d2e6d0639b6fbf214a2c
  checkpoints: ${ERD_REPO_ROOT}/runs/r6-ur10-20261005-1126/chain-ur10.summary.csv   # evaluate (peepo)

recording:
  output_root: ${ERD_DATA_ROOT}                # <repo>/data/real_robot, exported by workspace_setup.sh (gitignored)
  standstill_s: 30
  pre_roll_s: 2.0
  post_roll_s: 2.0
  max_lost_fraction: 0.001
